[project]
name = "chem-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
# Serving set: just what the chat app's tool bridge imports
# (app.scripts.flows.vector_store.tools). Keep it small; the web image installs only this.
dependencies = [
    "lancedb>=0.30.2",
    "numpy>=2.3.3",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "rdkit>=2026.3.1",
    "tqdm>=4.0.0",
]

[dependency-groups]
# Data pipeline, fine-tuning and orchestration. PyTorch runs on CUDA (Colab), MPS or CPU.
train = [
    "accelerate>=1.0.0",
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "duckdb>=1.4.0",
    "gguf>=0.18.0",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.0",
    "pandas>=2.3.2",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "transformers>=4.57.1",
]
dev = [
    "jupyterlab>=4.4.9",
    "pytest>=8.4.2",
    "ruff>=0.15.9",
    "seaborn>=0.13.2",
    "ty>=0.0.28",
]

[tool.uv]
# Local `uv sync` still installs everything; the serving image uses --no-default-groups.
default-groups = ["dev", "train"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ty.src]
# ponytail: eval still imports mlx-lm, which is no longer installed. Drop this
# exclude when eval is ported to Ollama.
exclude = ["app/scripts/flows/eval/eval_finetuned_model.py"]
