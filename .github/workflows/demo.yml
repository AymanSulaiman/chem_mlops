name: Live demo

# Checks the deployed demo from outside, like a visitor would. GitHub emails
# the repo owner when a scheduled run fails. Schedules only run from the
# default branch; run it by hand from the Actions tab on any branch.
on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:

env:
  DEMO_URL: https://demo.chemmlops.app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Page loads, with the Google sign-in button
        run: curl -fsS --max-time 30 "$DEMO_URL/" | grep -q 'id="google-button"'

      - name: Medical disclaimer is on the page
        run: curl -fsS --max-time 30 "$DEMO_URL/" | grep -q 'class="disclaimer"'

      - name: Server and model detection are up
        run: |
          curl -fsS --max-time 30 "$DEMO_URL/api/health" | grep -q '"ok":true'
          curl -fsS --max-time 60 "$DEMO_URL/api/model" | grep -q '"model":"chembl-drug-chat'

      - name: Sign-in is enforced
        run: |
          curl -fsS --max-time 30 "$DEMO_URL/api/config" | grep -q '"signInRequired":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$DEMO_URL/api/session")
          echo "POST /api/session without signing in -> $code"
          test "$code" = 401

      - name: Certificate is valid for at least 14 more days
        run: |
          host="${DEMO_URL#https://}"
          echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
            | openssl x509 -noout -checkend $((14 * 24 * 3600))
