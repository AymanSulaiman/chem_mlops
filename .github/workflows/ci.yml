name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: macos-14  # small CPU torch wheel; on Linux uv would pull the multi-GB CUDA build
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: .python-version

      - run: uv sync --frozen --group dev

      - run: uv run ruff check .

      - run: uv run ty check

      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12  # same as deploy/web.Dockerfile

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test

  # What the VM runs: catches a broken image or deploy config before vm.sh
  # spends an hour finding out on the e2-micro.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the deploy scripts
        run: shellcheck --severity=warning deploy/vm.sh deploy/publish_model.sh install.sh

      - name: Validate compose.yaml (local and public profiles)
        run: |
          MODEL_DIR=x docker compose config -q
          MODEL_DIR=x DOMAIN=demo.example.com GOOGLE_CLIENT_ID=x docker compose --profile public config -q

      - name: Validate the Caddyfile
        run: |
          docker run --rm -e DOMAIN=demo.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build the web image
        run: docker build -f deploy/web.Dockerfile -t chem-web .

      # draw_molecule needs system libraries the slim base lacks; a missing one
      # only shows up when RDKit draws, so draw something.
      - name: Smoke-test RDKit drawing in the image
        run: |
          docker run --rm chem-web uv run python -c "
          from rdkit import Chem
          from rdkit.Chem import Draw
          Draw.MolToImage(Chem.MolFromSmiles('CNCCC(Oc1ccc(C(F)(F)F)cc1)c1ccccc1')).save('/tmp/m.png')
          print('rdkit draw ok')"
