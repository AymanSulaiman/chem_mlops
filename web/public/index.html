<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chem MLOps Chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="layout">
      <header class="top-bar">
        <h1>Chem MLOps Chat</h1>
        <p id="model-label">Loading model...</p>
      </header>

      <details class="manual">
        <summary>What can I ask?</summary>
        <div class="manual__body" id="manual-body"></div>
      </details>

      <div class="pane">
        <section id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></section>
      </div>

      <form id="chat-form" class="input-row">
        <textarea
          id="input"
          placeholder="Ask about a drug, an interaction, or a structure..."
          rows="2"
          aria-label="Chat message"
        ></textarea>
        <button id="btn" type="submit">Send</button>
      </form>
    </div>

    <script type="module" src="/frontend.js"></script>
  </body>
</html>
